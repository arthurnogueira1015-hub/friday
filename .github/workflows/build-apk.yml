name: Build Jarvis APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Abrir o zip
        run: |
          shopt -s nullglob
          for z in *.zip; do
            echo "Abrindo $z"
            unzip -o -q "$z" -d _projeto
          done

      - name: Localizar o projeto
        run: |
          CFG=$(find . -maxdepth 4 -name capacitor.config.json -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$CFG" ]; then
            echo "::error::Nao achei o capacitor.config.json. Envie o arquivo jarvis-app.zip para o repositorio."
            exit 1
          fi
          DIR=$(dirname "$CFG")
          echo "APP_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Projeto em: $DIR"
          [ -f "$DIR/ci/build.sh" ] || { echo "::error::Falta ci/build.sh. Envie o jarvis-app.zip mais novo."; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Guardar downloads do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-cap6-v1

      - name: Guardar assinatura entre versoes
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: jarvis-debug-keystore-v1

      - name: Montar o APK
        working-directory: ${{ env.APP_DIR }}
        run: bash ci/build.sh

      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis-${{ github.run_number }}
          name: Jarvis ${{ github.run_number }}${{ env.LITE == '1' && ' (versao simples)' || '' }}
          files: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
